<svg viewBox="0 0 680 406" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>虚拟屏调用链路与分辨率失效点</title>
<desc>平时桌面只有物理屏；连接时 Sunshine 用稳定 device id 激活虚拟屏并切换分辨率；若用 DISPLAY 编号会找不到屏而回退物理屏。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">平时 · 未连接</text>
<g>
<rect x="40" y="42" width="280" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="68" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">物理屏 DISPLAY1</text>
<text x="56" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">3200×2000 · 唯一活动输出</text>
</g>
<g>
<rect x="360" y="42" width="280" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="376" y="68" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#04342C" dominant-baseline="central">虚拟屏 VDD by MTT</text>
<text x="376" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" dominant-baseline="central">设备已启用 · 不占桌面</text>
</g>

<text x="40" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">连接时 · Sunshine 自己的时序</text>
<g>
<rect x="40" y="152" width="130" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="105" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">Moonlight</text>
<text x="105" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">请求 2560×1440</text>
</g>
<path d="M174 180 L192 180" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="196" y="152" width="130" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="261" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">Sunshine</text>
<text x="261" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">ensure_only_display</text>
</g>
<path d="M330 180 L348 180" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="352" y="152" width="130" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="417" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">VDD 激活</text>
<text x="417" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">成为唯一输出</text>
</g>
<path d="M486 180 L504 180" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="508" y="152" width="130" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="573" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">分辨率切换</text>
<text x="573" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">2560×1440</text>
</g>

<text x="40" y="242" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">绑定 output_name：错与对</text>
<g>
<rect x="40" y="254" width="200" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="56" y="274" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#501313" dominant-baseline="central">output_name</text>
<text x="56" y="292" font-family="ui-monospace, monospace" font-size="12" fill="#A32D2D" dominant-baseline="central">\\.\DISPLAY54</text>
</g>
<path d="M244 282 L262 282" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="266" y="254" width="170" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="282" y="274" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#501313" dominant-baseline="central">编号已变</text>
<text x="282" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#A32D2D" dominant-baseline="central">找不到目标屏</text>
</g>
<path d="M440 282 L458 282" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="462" y="254" width="176" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="478" y="274" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#501313" dominant-baseline="central">静默回退物理屏</text>
<text x="478" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#A32D2D" dominant-baseline="central">分辨率不变</text>
</g>

<g>
<rect x="40" y="330" width="200" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="56" y="350" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#173404" dominant-baseline="central">output_name</text>
<text x="56" y="368" font-family="ui-monospace, monospace" font-size="12" fill="#3B6D11" dominant-baseline="central">{5eb52002-…}</text>
</g>
<path d="M244 358 L262 358" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="266" y="330" width="170" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="282" y="350" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#173404" dominant-baseline="central">GUID 稳定</text>
<text x="282" y="368" font-family="system-ui, sans-serif" font-size="12" fill="#3B6D11" dominant-baseline="central">始终命中 VDD</text>
</g>
<path d="M440 358 L458 358" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="462" y="330" width="176" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="478" y="350" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#173404" dominant-baseline="central">切到虚拟屏</text>
<text x="478" y="368" font-family="system-ui, sans-serif" font-size="12" fill="#3B6D11" dominant-baseline="central">分辨率跟随客户端</text>
</g>
</svg>
